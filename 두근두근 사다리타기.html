<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두근두근 사다리타기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* ===== 색상 토큰 (밝은 테마 기본) ===== */
  :root {
    --bg: #E8F4FF;
    --bg-dot: #CFE4FA;
    --surface: #FFFFFF;
    --ink: #23264A;
    --muted: #6B7096;
    --rail: #D6DCEE;
    --shadow: rgba(35, 38, 74, 0.14);
    --sun: #FFC93C;
    --sun-deep: #F2A900;
    --coral: #FF6B6B;
    --door-a: #FF8FA3;
    --door-b: #FFB5C2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  /* ===== 어두운 테마 ===== */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1D36; --bg-dot: #2A2D50; --surface: #282B4B; --ink: #F3F4FF;
      --muted: #A8ACD4; --rail: #45497A; --shadow: rgba(0, 0, 0, 0.35);
      --door-a: #E0607A; --door-b: #F08AA0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1D36; --bg-dot: #2A2D50; --surface: #282B4B; --ink: #F3F4FF;
    --muted: #A8ACD4; --rail: #45497A; --shadow: rgba(0, 0, 0, 0.35);
    --door-a: #E0607A; --door-b: #F08AA0;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    /* 공책 같은 점 무늬 배경 */
    background-image: radial-gradient(var(--bg-dot) 1.6px, transparent 1.6px);
    background-size: 22px 22px;
    overflow-x: hidden;
  }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 18px 60px; }

  /* ===== 제목: 글자가 하나씩 통통 튀어오름 ===== */
  h1 {
    font-family: "Jua", "Gowun Dodum", sans-serif;
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem);
    text-align: center;
    margin: 6px 0 4px;
    letter-spacing: 0.02em;
  }
  h1 span {
    display: inline-block;
    opacity: 0;
    transform: translateY(-40px) scale(0.6);
    animation: drop 0.6s cubic-bezier(.3,1.6,.5,1) forwards;
    animation-delay: calc(var(--i) * 70ms);
  }
  @keyframes drop { to { opacity: 1; transform: none; } }
  .subtitle {
    text-align: center; color: var(--muted); margin: 0 0 22px;
    opacity: 0; animation: fadeUp 0.6s ease 0.8s forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ===== 조작 영역 ===== */
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: center;
    margin-bottom: 18px;
    opacity: 0; animation: fadeUp 0.6s ease 1s forwards;
  }
  .stepper {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); padding: 6px 8px 6px 16px; border-radius: 999px;
    box-shadow: 0 4px 0 var(--shadow);
    font-family: "Jua", sans-serif; font-size: 1.1rem;
  }
  .stepper input {
    width: 52px; text-align: center; font: inherit; font-size: 1.3rem; color: var(--ink);
    border: none; background: transparent; outline: none; -moz-appearance: textfield;
  }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .round {
    width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    font-size: 1.3rem; font-family: "Jua", sans-serif; color: #fff; background: #748FFC;
    transition: transform 0.15s ease, filter 0.2s;
  }
  .round:hover:not(:disabled) { transform: scale(1.12); }
  .round:active:not(:disabled) { transform: scale(0.92); }

  .btn {
    font-family: "Jua", sans-serif; font-size: 1.25rem; border: none; cursor: pointer;
    padding: 12px 28px; border-radius: 999px; color: #3A2A00;
    background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.3s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 var(--sun-deep); }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-deep); }
  .btn.start.ready { animation: wiggle 2.4s ease-in-out infinite; }
  @keyframes wiggle {
    0%, 80%, 100% { transform: rotate(0); }
    84% { transform: rotate(-4deg) scale(1.05); }
    88% { transform: rotate(4deg) scale(1.05); }
    92% { transform: rotate(-2deg); }
  }
  .btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 0 5px 0 var(--shadow); }
  .btn.ghost:hover:not(:disabled) { box-shadow: 0 7px 0 var(--shadow); }
  button:disabled, input:disabled { opacity: 0.45; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid #4DABF7; outline-offset: 3px; }

  .status {
    text-align: center; color: var(--muted); min-height: 1.5em; margin: 0 0 14px;
    transition: opacity 0.3s;
  }

  /* ===== 사다리 판 ===== */
  .board-scroll { overflow-x: auto; padding: 8px 4px 14px; }
  .board {
    position: relative;
    background: var(--surface);
    border-radius: 28px;
    padding: 18px 10px;
    box-shadow: 0 8px 0 var(--shadow);
    opacity: 0; animation: fadeUp 0.7s ease 1.15s forwards;
  }
  .row { display: grid; grid-template-columns: repeat(var(--n), 1fr); }

  /* 칸마다 다른 색 (--c 값은 자바스크립트에서 지정) */
  .cell {
    position: relative;
    margin: 0 5px;
    border-radius: 18px;
    border: 3px solid var(--c);
    background: color-mix(in srgb, var(--c) 14%, var(--surface));
    padding: 8px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    opacity: 0; transform: scale(0.6);
    animation: pop 0.45s cubic-bezier(.3,1.5,.5,1) forwards;
    animation-delay: var(--d, 0ms);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  @keyframes pop { to { opacity: 1; transform: none; } }
  .cell.name { cursor: default; }
  .cell input {
    width: 100%; min-width: 0; text-align: center;
    font-family: "Jua", sans-serif; font-size: 1rem; color: var(--ink);
    background: transparent; border: none; border-bottom: 2px dashed color-mix(in srgb, var(--c) 60%, transparent);
    padding: 4px 2px; outline: none; transition: border-color 0.2s;
  }
  .cell input:focus { border-bottom-style: solid; border-bottom-color: var(--c); }
  .cell input:disabled { opacity: 1; cursor: default; pointer-events: none; border-bottom-color: transparent; }
  .badge {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--c); color: #fff; font-family: "Jua", sans-serif;
    display: grid; place-items: center; font-size: 1rem;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .clickable .cell.name { cursor: pointer; }
  .clickable .cell.name:hover { transform: translateY(-3px); }

  .cell.prize .gift { font-size: 1.1rem; line-height: 1; }
  .cell.prize.hit { animation: pop 0.45s forwards, bounce 0.6s ease; box-shadow: 0 0 0 4px var(--hit); }
  @keyframes bounce {
    0% { transform: scale(1); } 35% { transform: scale(1.14); } 65% { transform: scale(0.96); } 100% { transform: scale(1); }
  }
  .winner {
    font-family: "Jua", sans-serif; font-size: 0.85rem; color: #fff;
    background: var(--hit, transparent); border-radius: 999px; padding: 2px 10px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transform: scale(0); transition: transform 0.35s cubic-bezier(.3,1.6,.5,1);
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .cell.prize.hit .winner { transform: scale(1); }

  /* ===== 사다리 영역과 가림막 ===== */
  .ladder {
    position: relative;
    height: clamp(300px, 46vh, 460px);
    margin: 8px 0;
    border-radius: 18px;
    overflow: hidden;
  }
  .ladder svg { display: block; width: 100%; height: 100%; }

  .rail { stroke: var(--rail); stroke-width: 5; stroke-linecap: round; }
  .rung {
    stroke: var(--rail); stroke-width: 5; stroke-linecap: round;
    transform-box: fill-box; transform-origin: left center;
    transform: scaleX(0); opacity: 0;
  }
  /* 공개되면 가로줄이 차례로 그어짐 */
  .revealed .rung {
    animation: rungIn 0.35s ease forwards;
    animation-delay: var(--d);
  }
  .instant .rung { transform: none; opacity: 1; animation: none; }
  @keyframes rungIn { to { transform: scaleX(1); opacity: 1; } }

  .trail { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.3s; }
  .dot { stroke: #fff; stroke-width: 3; transition: opacity 0.3s; }
  .dim { opacity: 0.12; }

  .curtain { position: absolute; inset: 0; pointer-events: none; }
  .door {
    position: absolute; top: 0; bottom: 0; width: 50.5%;
    background: repeating-linear-gradient(135deg, var(--door-a) 0 22px, var(--door-b) 22px 44px);
    background-size: 62px 62px;
    animation: stripes 2.5s linear infinite;
    transition: transform 0.9s cubic-bezier(.7,0,.2,1);
  }
  .door.left { left: 0; border-radius: 18px 0 0 18px; }
  .door.right { right: 0; border-radius: 0 18px 18px 0; }
  @keyframes stripes { to { background-position: 62px 0; } }
  .curtain-msg {
    position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px;
    font-family: "Jua", sans-serif; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    transition: transform 0.4s ease, opacity 0.4s ease;
  }
  .curtain-msg .q {
    font-size: clamp(4rem, 12vw, 7rem); line-height: 1;
    animation: floaty 1.8s ease-in-out infinite;
  }
  .curtain-msg p { margin: 0; font-size: 1.15rem; padding: 0 12px; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
  .curtain.open .door.left { transform: translateX(-102%); }
  .curtain.open .door.right { transform: translateX(102%); }
  .curtain.open .curtain-msg { transform: scale(0.3); opacity: 0; }

  /* ===== 결과 발표 ===== */
  .results { margin-top: 26px; }
  .results h2 {
    font-family: "Jua", sans-serif; font-weight: 400; text-align: center; font-size: 1.8rem; margin: 0 0 14px;
    animation: pop 0.5s cubic-bezier(.3,1.5,.5,1) forwards;
  }
  .result-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px;
    list-style: none; padding: 0; margin: 0;
  }
  .result {
    display: flex; align-items: center; gap: 10px; cursor: pointer;
    background: var(--surface); border-radius: 16px; padding: 12px 14px;
    border-left: 8px solid var(--c);
    box-shadow: 0 4px 0 var(--shadow);
    opacity: 0; transform: translateY(20px) scale(0.9);
    animation: pop 0.45s cubic-bezier(.3,1.5,.5,1) forwards;
    animation-delay: var(--d);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .result:hover { transform: translateY(-3px); }
  .result.active { box-shadow: 0 0 0 3px var(--c), 0 4px 0 var(--shadow); }
  .result .who { font-family: "Jua", sans-serif; font-size: 1.1rem; }
  .result .arrow { color: var(--muted); }
  .result .what { font-family: "Jua", sans-serif; color: var(--c); font-size: 1.1rem; filter: brightness(0.85); }
  .result .who, .result .what { overflow-wrap: anywhere; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }

  /* 움직임 줄이기 설정을 켠 사용자 배려 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title" aria-label="두근두근 사다리타기"></h1>
  <p class="subtitle">이름과 당첨 내역을 적고 시작을 누르면 사다리가 공개돼요</p>

  <div class="controls">
    <div class="stepper" aria-label="인원수">
      <span>인원</span>
      <button class="round" id="minus" aria-label="한 명 줄이기">−</button>
      <input type="number" id="count" min="2" max="12" value="5" aria-label="인원수 입력">
      <button class="round" id="plus" aria-label="한 명 늘리기">+</button>
    </div>
    <button class="btn start ready" id="startBtn">🚀 시작</button>
    <button class="btn ghost" id="resetBtn">🔄 다시 하기</button>
  </div>

  <p class="status" id="status">인원수를 정하고 이름과 당첨 내역을 입력해 주세요</p>

  <div class="board-scroll">
    <div class="board" id="board">
      <div class="row" id="names"></div>
      <div class="ladder" id="ladder">
        <svg id="svg" aria-hidden="true"></svg>
        <div class="curtain" id="curtain">
          <div class="door left"></div>
          <div class="door right"></div>
          <div class="curtain-msg">
            <div class="q">?</div>
            <p>시작 버튼을 누르면 사다리가 공개됩니다</p>
          </div>
        </div>
      </div>
      <div class="row" id="prizes"></div>
    </div>
  </div>

  <section class="results" id="results" aria-live="polite"></section>
</div>
<canvas id="confetti"></canvas>

<script>
/* ===== 기본 설정 ===== */
const COLORS = ['#FF6B6B', '#FFA94D', '#F5C518', '#51CF66', '#20C997', '#4DABF7',
                '#748FFC', '#B197FC', '#F783AC', '#15AABF', '#FF8787', '#94D82D'];
const ROWS = 12;          // 가로줄이 놓일 수 있는 층 수
const MIN = 2, MAX = 12;  // 인원수 범위
const DUR = 2600;         // 한 사람이 사다리를 내려가는 시간(ms)

// 처음 열었을 때 들어 있는 예시 5명
let names  = ['김민준', '이서연', '박지호', '최수아', '정하은'];
let prizes = ['☕ 커피 쿠폰', '😅 꽝', '🍪 간식 선물', '🎤 발표자', '🍀 다음 기회에'];
let count = 5;
let rungs = [];       // rungs[층][칸 사이 번호] = 높이 흔들림 값 또는 null
let results = [];     // results[사람 번호] = 도착한 당첨 칸 번호
let phase = 'ready';  // ready(대기) → running(진행 중) → done(완료)
let selected = null;  // 결과에서 강조 중인 사람

/* ===== 화면 요소 ===== */
const $ = (id) => document.getElementById(id);
const board = $('board'), namesEl = $('names'), prizesEl = $('prizes');
const ladder = $('ladder'), svg = $('svg'), curtain = $('curtain');
const countInput = $('count'), startBtn = $('startBtn'), resetBtn = $('resetBtn');
const statusEl = $('status'), resultsEl = $('results');
const SVGNS = 'http://www.w3.org/2000/svg';

/* ===== 제목 글자를 하나씩 쪼개서 애니메이션 ===== */
(function buildTitle() {
  const text = '🪜 두근두근 사다리타기';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    s.style.setProperty('--i', i);
    s.setAttribute('aria-hidden', 'true');
    $('title').appendChild(s);
  });
})();

/* ===== 사다리 무작위 생성 ===== */
function jitter() { return (Math.random() - 0.5) * 0.6; }

function generateLadder() {
  rungs = [];
  for (let r = 0; r < ROWS; r++) {
    const row = new Array(count - 1).fill(null);
    for (let i = 0; i < count - 1; i++) {
      // 바로 옆 칸과 같은 층에 가로줄이 붙지 않도록 함
      if ((i === 0 || row[i - 1] === null) && Math.random() < 0.42) row[i] = jitter();
    }
    rungs.push(row);
  }
  // 칸 사이마다 가로줄이 최소 2개는 있도록 보충
  for (let i = 0; i < count - 1; i++) {
    let have = rungs.filter(row => row[i] !== null).length;
    let tries = 0;
    while (have < 2 && tries < 80) {
      const row = rungs[Math.floor(Math.random() * ROWS)];
      const leftFree = i === 0 || row[i - 1] === null;
      const rightFree = i === count - 2 || row[i + 1] === null;
      if (row[i] === null && leftFree && rightFree) { row[i] = jitter(); have++; }
      tries++;
    }
  }
}

/* ===== 이름 칸과 당첨 칸 만들기 ===== */
function buildCells() {
  board.style.setProperty('--n', count);
  board.style.minWidth = (count * 92) + 'px';
  namesEl.innerHTML = '';
  prizesEl.innerHTML = '';

  for (let i = 0; i < count; i++) {
    const color = COLORS[i % COLORS.length];

    // 위쪽: 참가자 이름 칸
    const nc = document.createElement('div');
    nc.className = 'cell name';
    nc.style.setProperty('--c', color);
    nc.style.setProperty('--d', (i * 60) + 'ms');
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = i + 1;
    const ni = document.createElement('input');
    ni.value = names[i];
    ni.placeholder = '이름';
    ni.maxLength = 10;
    ni.setAttribute('aria-label', (i + 1) + '번 참가자 이름');
    ni.addEventListener('input', () => { names[i] = ni.value; });
    nc.append(badge, ni);
    nc.addEventListener('click', () => { if (phase === 'done') highlight(i); });
    namesEl.appendChild(nc);

    // 아래쪽: 당첨 내역 칸
    const pc = document.createElement('div');
    pc.className = 'cell prize';
    pc.style.setProperty('--c', color);
    pc.style.setProperty('--d', (i * 60 + 200) + 'ms');
    const gift = document.createElement('span');
    gift.className = 'gift';
    gift.textContent = '🎁';
    const pi = document.createElement('input');
    pi.value = prizes[i];
    pi.placeholder = '당첨 내역';
    pi.maxLength = 14;
    pi.setAttribute('aria-label', (i + 1) + '번 당첨 내역');
    pi.addEventListener('input', () => { prizes[i] = pi.value; });
    const win = document.createElement('div');
    win.className = 'winner';
    pc.append(gift, pi, win);
    prizesEl.appendChild(pc);
  }
}

/* ===== 사다리 좌표 계산 ===== */
function geo() {
  const W = ladder.clientWidth, H = ladder.clientHeight;
  const pad = 14;
  const gap = (H - pad * 2) / (ROWS + 1);
  return {
    W, H,
    x: (i) => (W / count) * (i + 0.5),
    y: (r, j) => pad + (r + 1 + j) * gap
  };
}

// 한 사람이 사다리를 타고 내려가는 경로 계산
function trace(start, g) {
  let c = start;
  const pts = [[g.x(c), 0]];
  for (let r = 0; r < ROWS; r++) {
    const right = c < count - 1 ? rungs[r][c] : null;
    const left = c > 0 ? rungs[r][c - 1] : null;
    if (right !== null && right !== undefined) {
      const y = g.y(r, right);
      pts.push([g.x(c), y], [g.x(c + 1), y]);
      c++;
    } else if (left !== null && left !== undefined) {
      const y = g.y(r, left);
      pts.push([g.x(c), y], [g.x(c - 1), y]);
      c--;
    }
  }
  pts.push([g.x(c), g.H]);
  return { pts, end: c };
}

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* ===== 사다리 그리기 ===== */
let gTrails, gDots;
function renderLadder() {
  const g = geo();
  svg.setAttribute('viewBox', `0 0 ${g.W} ${g.H}`);
  svg.innerHTML = '';
  svg.classList.remove('revealed', 'instant');

  // 세로줄
  for (let i = 0; i < count; i++) {
    svg.appendChild(el('line', { class: 'rail', x1: g.x(i), y1: 0, x2: g.x(i), y2: g.H }));
  }
  // 가로줄 (위에서부터 차례로 나타나도록 지연값 부여)
  let n = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let i = 0; i < count - 1; i++) {
      if (rungs[r][i] === null) continue;
      const y = g.y(r, rungs[r][i]);
      const line = el('line', { class: 'rung', x1: g.x(i), y1: y, x2: g.x(i + 1), y2: y });
      line.style.setProperty('--d', (n++ * 25) + 'ms');
      svg.appendChild(line);
    }
  }
  gTrails = el('g', {});
  gDots = el('g', {});
  svg.append(gTrails, gDots);

  // 이미 끝난 상태라면 (화면 크기 변경 시) 경로를 바로 다시 그림
  if (phase === 'done') {
    svg.classList.add('instant');
    for (let i = 0; i < count; i++) {
      const { pts } = trace(i, g);
      const color = COLORS[i % COLORS.length];
      gTrails.appendChild(el('path', { class: 'trail', d: toD(pts), stroke: color }));
      const last = pts[pts.length - 1];
      gDots.appendChild(el('circle', { class: 'dot', r: 9, cx: last[0], cy: last[1] - 10, fill: color }));
    }
    if (selected !== null) applyDim();
  }
}

function toD(pts) { return pts.map((p, k) => (k ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' '); }

/* ===== 시작: 가림막 열기 → 가로줄 공개 → 경로 따라 내려가기 ===== */
function start() {
  if (phase !== 'ready') return;
  // 빈 칸은 기본값으로 채움
  for (let i = 0; i < count; i++) {
    if (!names[i] || !names[i].trim()) names[i] = '참가자 ' + (i + 1);
    if (!prizes[i] || !prizes[i].trim()) prizes[i] = '꽝';
  }
  buildCellsKeepAnim();
  setPhase('running');

  curtain.classList.add('open');
  svg.classList.add('revealed');
  statusEl.textContent = '두근두근… 사다리를 타는 중이에요!';

  const rungCount = svg.querySelectorAll('.rung').length;
  setTimeout(runTrails, 700 + rungCount * 25);
}

// 입력값만 갱신하고 칸은 다시 만들지 않음 (깜빡임 방지)
function buildCellsKeepAnim() {
  namesEl.querySelectorAll('input').forEach((inp, i) => inp.value = names[i]);
  prizesEl.querySelectorAll('input').forEach((inp, i) => inp.value = prizes[i]);
}

function easeInOut(t) { return -(Math.cos(Math.PI * t) - 1) / 2; }

function runTrails() {
  const g = geo();
  const stagger = Math.min(380, 2600 / count);
  const items = [];
  results = [];

  for (let i = 0; i < count; i++) {
    const { pts, end } = trace(i, g);
    results[i] = end;
    const color = COLORS[i % COLORS.length];
    const path = el('path', { class: 'trail', d: toD(pts), stroke: color });
    gTrails.appendChild(path);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    const dot = el('circle', { class: 'dot', r: 9, cx: pts[0][0], cy: 0, fill: color, opacity: 0 });
    gDots.appendChild(dot);
    items.push({ i, path, dot, len, end, delay: i * stagger, done: false });
  }

  const t0 = performance.now();
  function frame(now) {
    let all = true;
    for (const it of items) {
      const p = Math.min(Math.max((now - t0 - it.delay) / DUR, 0), 1);
      const e = easeInOut(p);
      it.path.style.strokeDashoffset = it.len * (1 - e);
      const pt = it.path.getPointAtLength(it.len * e);
      it.dot.setAttribute('cx', pt.x);
      it.dot.setAttribute('cy', Math.max(pt.y, 10));
      it.dot.setAttribute('opacity', p > 0 ? 1 : 0);
      if (p >= 1 && !it.done) {
        it.done = true;
        it.dot.setAttribute('cy', pt.y - 10);
        land(it.i, it.end);
      }
      if (p < 1) all = false;
    }
    if (!all) requestAnimationFrame(frame);
    else setTimeout(finish, 400);
  }
  requestAnimationFrame(frame);
}

// 도착한 당첨 칸에 이름표 붙이기
function land(person, prizeIdx) {
  const cell = prizesEl.children[prizeIdx];
  cell.style.setProperty('--hit', COLORS[person % COLORS.length]);
  cell.querySelector('.winner').textContent = '🎉 ' + names[person];
  cell.classList.remove('hit');
  void cell.offsetWidth; // 애니메이션 재시작용
  cell.classList.add('hit');
}

/* ===== 결과 발표 ===== */
function finish() {
  setPhase('done');
  statusEl.textContent = '결과 카드나 이름을 누르면 그 사람의 길만 보여 드려요';

  resultsEl.innerHTML = '';
  const h = document.createElement('h2');
  h.textContent = '🎉 결과 발표';
  const ul = document.createElement('ul');
  ul.className = 'result-list';
  for (let i = 0; i < count; i++) {
    const li = document.createElement('li');
    li.className = 'result';
    li.style.setProperty('--c', COLORS[i % COLORS.length]);
    li.style.setProperty('--d', (i * 90) + 'ms');
    li.tabIndex = 0;
    const who = document.createElement('span'); who.className = 'who'; who.textContent = names[i];
    const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '▶';
    const what = document.createElement('span'); what.className = 'what'; what.textContent = prizes[results[i]];
    li.append(who, arrow, what);
    li.addEventListener('click', () => highlight(i));
    li.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); highlight(i); } });
    ul.appendChild(li);
  }
  resultsEl.append(h, ul);
  setTimeout(() => resultsEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
  confetti();
}

/* ===== 한 사람의 경로만 강조 ===== */
function highlight(i) {
  selected = selected === i ? null : i;
  applyDim();
}
function applyDim() {
  [...gTrails.children].forEach((p, k) => p.classList.toggle('dim', selected !== null && k !== selected));
  [...gDots.children].forEach((d, k) => d.classList.toggle('dim', selected !== null && k !== selected));
  resultsEl.querySelectorAll('.result').forEach((r, k) => r.classList.toggle('active', k === selected));
}

/* ===== 상태 전환 ===== */
function setPhase(p) {
  phase = p;
  const editable = p === 'ready';
  board.querySelectorAll('input').forEach(inp => inp.disabled = !editable);
  countInput.disabled = !editable;
  $('minus').disabled = !editable;
  $('plus').disabled = !editable;
  startBtn.disabled = !editable;
  startBtn.classList.toggle('ready', editable);
  resetBtn.disabled = p === 'running';
  board.classList.toggle('clickable', p === 'done');
}

// 다시 하기: 새 사다리를 만들고 다시 가림
function reset() {
  if (phase === 'running') return;
  selected = null;
  resultsEl.innerHTML = '';
  prizesEl.querySelectorAll('.cell').forEach(c => c.classList.remove('hit'));
  curtain.classList.remove('open');
  setPhase('ready');
  statusEl.textContent = '새 사다리가 준비됐어요. 시작을 눌러 주세요';
  generateLadder();
  // 가림막이 닫힌 뒤에 사다리를 새로 그림 (그동안 시작 버튼 잠시 잠금)
  startBtn.disabled = true;
  setTimeout(() => { renderLadder(); startBtn.disabled = false; }, 450);
}

// 인원수 변경
function setCount(n) {
  if (phase !== 'ready') return;
  n = Math.min(MAX, Math.max(MIN, parseInt(n, 10) || MIN));
  countInput.value = n;
  if (n === count) return;
  for (let i = names.length; i < n; i++) names[i] = '참가자 ' + (i + 1);
  for (let i = prizes.length; i < n; i++) prizes[i] = '😅 꽝';
  count = n;
  generateLadder();
  buildCells();
  renderLadder();
}

/* ===== 축하 색종이 ===== */
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('confetti'), ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const parts = Array.from({ length: 160 }, () => ({
    x: innerWidth / 2 + (Math.random() - 0.5) * 200,
    y: innerHeight * 0.35,
    vx: (Math.random() - 0.5) * 14,
    vy: -Math.random() * 14 - 4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
    rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)]
  }));
  const t0 = performance.now();
  (function draw(now) {
    const t = now - t0;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of parts) {
      p.vy += 0.35; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - t / 3200);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (t < 3200) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

/* ===== 이벤트 연결 ===== */
$('minus').addEventListener('click', () => setCount(count - 1));
$('plus').addEventListener('click', () => setCount(count + 1));
countInput.addEventListener('change', () => setCount(countInput.value));
startBtn.addEventListener('click', start);
resetBtn.addEventListener('click', reset);

// 화면 크기가 바뀌면 사다리를 다시 그림 (진행 중에는 제외)
let rt;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (phase === 'running') return;
    renderLadder();
    if (phase !== 'ready') svg.classList.add('instant');
  }, 150);
});

/* ===== 첫 실행 ===== */
generateLadder();
buildCells();
setPhase('ready');
requestAnimationFrame(renderLadder);
</script>
</body>
</html>
