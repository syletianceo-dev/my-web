<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 웹 모음</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
    min-height: 100vh;
    color: #1f2937;
    padding: 48px 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }
  header p { margin-top: 8px; color: #6b7280; }

  section { margin-bottom: 32px; }
  section h2 {
    font-size: 1.1rem;
    font-weight: 700;
    color: #4b5563;
    margin-bottom: 12px;
    padding-left: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .list { display: grid; gap: 12px; }
  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: #fff;
    border-radius: 14px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,.10);
  }
  .icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    display: grid; place-items: center;
    font-size: 1.6rem;
    flex-shrink: 0;
  }
  .fun .icon  { background: #fef3c7; }
  .news .icon { background: #dbeafe; }
  .title { font-size: 1.05rem; font-weight: 700; }
  .desc { font-size: .88rem; color: #6b7280; margin-top: 2px; }
  .arrow { margin-left: auto; color: #9ca3af; font-size: 1.2rem; }
  footer { text-align: center; color: #9ca3af; font-size: .8rem; margin-top: 48px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🏠 나의 웹 모음</h1>
      <p>원하는 항목을 눌러 바로 이동하세요</p>
    </header>

    <section class="fun">
      <h2>🎉 재미</h2>
      <div class="list">
        <a class="card" href="./%EB%91%90%EA%B7%BC%EB%91%90%EA%B7%BC%20%EC%82%AC%EB%8B%A4%EB%A6%AC%ED%83%80%EA%B8%B0.html">
          <div class="icon">🪜</div>
          <div>
            <div class="title">사다리타기</div>
            <div class="desc">두근두근 사다리타기 게임</div>
          </div>
          <span class="arrow">›</span>
        </a>
      </div>
    </section>

    <section class="news">
      <h2>📰 뉴스</h2>
      <div class="list">
        <a class="card" href="https://script.google.com/macros/s/AKfycbxAN2q8kXAsBjYNC_Yi0cAmLoeBUZtD7vpdMlIRojNs5MHmmHKAn9oW62vkOkBYFGfJOQ/exec" target="_blank" rel="noopener">
          <div class="icon">⚡</div>
          <div>
            <div class="title">한전뉴스대시보드</div>
            <div class="desc">한전 관련 최신 뉴스 모아보기 (새 창)</div>
          </div>
          <span class="arrow">›</span>
        </a>
      </div>
    </section>

    <footer>© 2026</footer>
  </div>
</body>
</html>
